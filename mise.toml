[tools]
go = "1.26.5"
golangci-lint = "2.12.2"

[tasks.build]
description = "Build the ci-snitch binary"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
go build -ldflags "-s -w -X main.version=$VERSION" -o bin/ci-snitch ./cmd/ci-snitch
"""

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.test-race]
description = "Run all tests with the race detector"
run = "go test -race ./..."

[tasks.vuln]
description = "Scan dependencies for known vulnerabilities"
run = "go run golang.org/x/vuln/cmd/govulncheck@latest ./..."

[tasks.fmt]
description = "Run goimports and gofmt on all Go files"
run = "golangci-lint fmt ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."
# fmt must finish before lint reads the files: `check` runs independent
# depends in parallel, which raced golangci-lint fmt against run.
depends = ["fmt"]

[tasks.check]
description = "Format, lint, and test"
depends = ["lint", "test"] # lint depends on fmt
